        // Load all chapters
        function loadChapters() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '';
            
            cramData.chapters.forEach(chapter => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter';
                chapterDiv.id = `chapter-${chapter.number}`;
                
                let contentHtml = `
                    <h2>
                        Chapter ${chapter.number}: ${chapter.title}
                        <button class="toggle-btn" onclick="toggleChapter(${chapter.number})">Expand</button>
                    </h2>
                    <div class="chapter-content" id="content-${chapter.number}">
                `;
                
                chapter.sections.forEach(section => {
                    contentHtml += `
                        <div class="section">
                            <h3>${section.name}</h3>
                            ${section.content}
                        </div>
                    `;
                });
                
                contentHtml += '</div>';
                chapterDiv.innerHTML = contentHtml;
                mainContent.appendChild(chapterDiv);
            });
            
            // Add quiz section at the end
            addQuizSection();
        }

        function toggleChapter(chapterNum) {
            const content = document.getElementById(`content-${chapterNum}`);
            const btn = event.target;
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                btn.textContent = 'Expand';
            } else {
                content.classList.add('show');
                btn.textContent = 'Collapse';
            }
        }

        function expandAll() {
            cramData.chapters.forEach(chapter => {
                const content = document.getElementById(`content-${chapter.number}`);
                content.classList.add('show');
            });
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.textContent = 'Collapse';
            });
        }

        function collapseAll() {
            cramData.chapters.forEach(chapter => {
                const content = document.getElementById(`content-${chapter.number}`);
                content.classList.remove('show');
            });
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.textContent = 'Expand';
            });
        }

        function searchTopics() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const chapters = document.querySelectorAll('.chapter');
            
            if (searchTerm === '') {
                chapters.forEach(ch => ch.style.display = 'block');
                return;
            }
            
            chapters.forEach(chapter => {
                const text = chapter.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    chapter.style.display = 'block';
                    chapter.querySelector('.chapter-content').classList.add('show');
                } else {
                    chapter.style.display = 'none';
                }
            });
        }

                        <p><strong>Answer:</strong> Ameloblasts (enamel-forming cells) are sacrificed during enamel maturation and are completely lost when enamel formation is complete. Without these cells, new enamel cannot be produced.</p>

                    <ul>
                        <li>Memorize the major tissue compositions (% of minerals vs. organic)</li>

                        <li>Know the timeline of tooth development stages (Bud→Cap→Bell)</li>
                        <li>Be familiar with the four stages of wound healing</li>
                        <li>Understand the progression from gingivitis to severe periodontitis</li>
                        <li>Know the functions of each salivary component</li>
                        <li>Draw and label the tooth anatomy - visual learning helps!</li>
                    </ul>

            const answer = button.nextElementSibling;
